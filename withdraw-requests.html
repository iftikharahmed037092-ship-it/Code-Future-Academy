<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw Requests</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.request-card{
background:#fff;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.buttons button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
font-weight:bold;
}

.approve{
background:#28a745;
}

.reject{
background:#dc3545;
}

</style>

</head>

<body>

<div class="container">

<h1>Withdraw Requests</h1>

<div id="requestsContainer">

</div>

</div>

<script type="module" src="withdraw-requests.js"></script>

</body>
</html>
