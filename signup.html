<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="login.css">
    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #eef4ff,
        #ffffff,
        #f4f7ff
    );

    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.signup-box{
    width:100%;
    max-width:500px;

    background:#fff;

    padding:40px;

    border-radius:25px;

    box-shadow:0 20px 40px rgba(0,0,0,.1);
}

.signup-box{
    max-width:500px;
    margin:auto;
    background:#ffffff;
    padding:40px;
    border-radius:25px;
    box-shadow:0 20px 40px rgba(0,0,0,.1);
}

.signup-box h1{
    text-align:center;
    margin-bottom:10px;
    color:#111;
}

.signup-box p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#0066ff;
}

button{
    padding:15px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.login-text{
    margin-top:20px;
    text-align:center;
}

.login-text a{
    text-decoration:none;
    color:#0066ff;
    font-weight:600;
}
       .back-btn{
    position:fixed;
    top:20px;
    left:20px;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;

    color:#111;

    text-decoration:none;

    font-size:24px;

    border-radius:50%;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    z-index:9999;
} 

    </style>
</head>
<body>
    
 <a href="login.html" class="back-btn">←</a>

    
<div class="container">

    <div class="signup-box">

        <h1>Create Account</h1>

        <p>Register a new account</p>

        <form id="signupForm">

    <input type="text" id="fullName" placeholder="Full Name">

    <input type="email" id="email" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <input type="password" id="confirmPassword" placeholder="Confirm Password">

    <button type="submit">Sign Up</button>

        </form>

        <p class="signup-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

    <script type="module" src="signup.js"></script>

</body>
</html>
