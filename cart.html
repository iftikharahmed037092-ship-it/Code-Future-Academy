<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:90px 20px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.cart-item{
    background:#fff;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.item-title{
    font-size:20px;
    margin-bottom:10px;
}

.item-price{
    color:#0066ff;
    font-weight:bold;
}

.cart-total{
margin-top:20px;
font-size:22px;
font-weight:bold;
text-align:right;
color:#0066ff;
}

.checkout-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:20px;
}

</style>

</head>

<body>

<a href="products.html" class="back-btn">←</a>

<div class="container">

<h1>My Cart</h1>

<div id="cartItems"></div>

    <div id="cartTotal" class="cart-total">
Total: Rs 0
    </div>

</div>


<button
id="checkoutBtn"
class="checkout-btn">
Proceed To Checkout
</button>

</div>

<script type="module" src="cart.js"></script>

</body>

</html>
