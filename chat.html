<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.container{
max-width:900px;
margin:30px auto;
background:white;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
overflow:hidden;
}

.header{
background:#0066ff;
color:white;
padding:20px;
font-size:22px;
font-weight:bold;
}

#messages{
height:450px;
overflow-y:auto;
padding:20px;
background:#fafafa;
}

.message{
background:#e8f0ff;
padding:12px;
margin-bottom:12px;
border-radius:10px;
}

.time{
font-size:12px;
color:#666;
margin-top:5px;
}

.bottom{
display:flex;
padding:15px;
gap:10px;
background:white;
border-top:1px solid #ddd;
}

.bottom input{
flex:1;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

.bottom button{
padding:14px 25px;
border:none;
border-radius:10px;
background:#0066ff;
color:white;
font-weight:bold;
cursor:pointer;
}

.bottom button:hover{
background:#0052cc;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

Buyer & Seller Chat

</div>

<div id="messages">

</div>

<div class="bottom">

<input
type="text"
id="message"
placeholder="Type your message...">

<button id="sendBtn">

Send

</button>

</div>

</div>

<script type="module" src="chat.js"></script>

</body>

  </html>
