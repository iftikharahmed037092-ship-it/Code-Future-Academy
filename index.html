<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    padding-top:90px;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    background:#ffffff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 8%;
    box-shadow:0 2px 20px rgba(0,0,0,0.08);
    z-index:1000;
}

.logo h2{
    font-size:28px;
    font-weight:700;
    color:#111;
}

.navbar{
    display:flex;
    gap:35px;
}

.navbar a{
    text-decoration:none;
    color:#333;
    font-size:16px;
    font-weight:600;
    transition:0.3s;
}

.navbar a:hover{
    color:#0066ff;
}

.menu-btn{
    display:none;
    background:none;
    border:none;
    font-size:32px;
    cursor:pointer;
}

@media(max-width:768px){

    .navbar{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .logo h2{
        font-size:22px;
    }

}
        @media(max-width:768px){

    .navbar{
        display:none;
        position:absolute;
        top:80px;
        left:0;
        width:100%;
        background:#ffffff;
        flex-direction:column;
        gap:0;
        box-shadow:0 10px 20px rgba(0,0,0,0.1);
    }

    .navbar a{
        padding:20px;
        border-bottom:1px solid #eee;
    }

    .navbar.active{
        display:flex;
    }

    .menu-btn{
        display:block;
    }
        }
        .login-btn{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
        }
    </style>
</head>

<body>
    <header>

    <div class="logo">
        <h2>My Website</h2>
    </div>

 <nav class="navbar" id="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>
<button class="login-btn">Login</button>
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<button class="menu-btn" onclick="toggleMenu()">☰</button>


    </header>
    
    <script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
}
    </script>

</body>


</html>
