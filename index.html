<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 8%;
    background:#ffffff;
    box-shadow:0 2px 20px rgba(0,0,0,0.08);
    z-index:1000;
}

header div:first-child{
    display:flex;
    align-items:center;
    gap:12px;
}

header img{
    width:45px;
    height:45px;
    object-fit:cover;
}

header h1{
    font-size:24px;
    font-weight:700;
}

nav{
    display:flex;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-size:16px;
    font-weight:500;
    transition:0.3s;
}

nav a:hover{
    color:#007bff;
}

header div:last-child{
    display:flex;
    align-items:center;
    gap:12px;
}

input[type="search"]{
    width:220px;
    padding:10px 15px;
    border:1px solid #ddd;
    border-radius:30px;
    outline:none;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
}

button:last-child{
    color:#fff;
    background:#007bff;
}

button:last-child:hover{
    transform:translateY(-2px);
}

@media (max-width:992px){

    nav{
        display:none;
    }

    input[type="search"]{
        display:none;
    }

    header{
        padding:0 5%;
    }

    header h1{
        font-size:20px;
    }
}
    </style>
</head>

<body>

</body>
    <header>

    <div>
        <img src="logo.png" alt="Logo">
        <h1>My Website</h1>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
    </nav>

    <div>
        <input type="search" placeholder="Search...">

        <button>Login</button>

        <button>Sign Up</button>

        <button>Get Started</button>
    </div>

    </header>

</html>
