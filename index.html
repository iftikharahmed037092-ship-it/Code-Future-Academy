<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    padding-top:80px;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    box-shadow:0 2px 20px rgba(0,0,0,0.08);
    z-index:1000;
}

.logo h2{
    font-size:28px;
    font-weight:700;
    color:#111;
}

.navbar{
    display:flex;
    gap:35px;
}

.navbar a{
    text-decoration:none;
    color:#333;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.navbar a:hover{
    color:#0066ff;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.login-btn{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:#0066ff;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.menu-btn{
    display:none;
    background:none;
    border:none;
    font-size:32px;
    cursor:pointer;
}

@media(max-width:768px){

    .navbar{
        display:none;
        position:absolute;
        top:80px;
        left:0;
        width:100%;
        background:#fff;
        flex-direction:column;
        gap:0;
        box-shadow:0 10px 20px rgba(0,0,0,0.08);
    }

    .navbar a{
        padding:18px 25px;
        border-bottom:1px solid #eee;
    }

    .navbar.active{
        display:flex;
    }

    .menu-btn{
        display:block;
    }

    .logo h2{
        font-size:22px;
    }

    .login-btn{
        padding:8px 16px;
        font-size:14px;
    }
}
.hero{
    min-height:auto;
    padding:120px 8% 120px;
    align-items:flex-start;
    display:flex;
    justify-content:space-between;
    gap:60px;

    background:
    linear-gradient(
        135deg,
        #eef4ff 0%,
        #ffffff 50%,
        #f4f7ff 100%
    );

    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;

    background:
    radial-gradient(
        rgba(0,102,255,.18),
        transparent
    );

    top:-100px;
    right:-100px;

    filter:blur(40px);
}

.hero{
    position:relative;
}

.hero-text{
    flex:1;
    z-index:2;
}

.tag{
    display:inline-block;
    padding:10px 18px;
    border-radius:50px;
    background:#ffffff;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:20px;
    font-weight:600;
}

.hero-text h1{
    font-size:4rem;
    line-height:1.1;
    margin-bottom:20px;
    color:#111;
}

.hero-text p{
    font-size:1.1rem;
    line-height:1.8;
    color:#666;
    max-width:600px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.primary-btn{
    padding:14px 32px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:#fff;
    cursor:pointer;
    font-weight:600;
}

.secondary-btn{
    padding:14px 32px;
    border:2px solid #0066ff;
    border-radius:50px;
    background:transparent;
    color:#0066ff;
    cursor:pointer;
    font-weight:600;
}

.hero-image{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
}

.hero-image img{
    width:100%;
    max-width:550px;
}

.floating-card{
    position:absolute;
    top:40px;
    left:0;

    padding:18px 25px;

    background:#ffffff;
    border-radius:20px;

    box-shadow:
    0 20px 40px rgba(0,0,0,.12);

    font-weight:700;

    animation:float 4s ease-in-out infinite;
}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-20px);
    }

    100%{
        transform:translateY(0);
    }

}

@media(max-width:768px){

    .hero{
        flex-direction:column;
        text-align:center;
    }

    .hero-text h1{
        font-size:2.5rem;
    }

    .hero-image img{
        max-width:350px;
    }

}
    </style>
</head>

<body>
    <header>

    <div class="logo">
        <h2>My Website</h2>
    </div>

 <nav class="navbar" id="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>
<div class="header-actions">
    <button class="login-btn">Login</button>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>
    </header>
<section class="hero">

    <div class="hero-text">

        <span class="tag">Modern Design</span>

        <h1>Build Professional Websites With Style</h1>

        <p>
            Create modern, responsive and beautiful websites
            with premium user experience and stunning layouts.
        </p>

        <div class="hero-buttons">
            <button class="primary-btn">Get Started</button>
            <button class="secondary-btn">Learn More</button>
        </div>

    </div>

    <div class="hero-image">

        <img src="image.png" alt="Hero Image">

        <div class="floating-card">
            Premium Design
        </div>

    </div>
    <div class="wave"></div>

</section>
    <script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
}
    </script>

</body>


</html>
