<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0e14; font-family: sans-serif; }
        
        header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 15px 40px; background: #0b0e14; border-bottom: 1px solid #222;
        }

        /* لوگو اور اینیمیشن */
        .logo-box { position: relative; display: flex; align-items: center; gap: 15px; padding: 10px; }
        .cfaa-logo { 
            background: #161b22; padding: 8px; border-radius: 10px; 
            border: 1px solid #333; position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        /* وہ لائن جو کونے سے کونے تک اینیمیٹ ہوگی */
        .cfaa-logo::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, #6e8efb, transparent);
            animation: moveLine 3s infinite;
        }
        @keyframes moveLine { 100% { left: 100%; } }

        /* گلو ایفیکٹ */
        .glow-text:hover { color: #fff; text-shadow: 0 0 10px #6e8efb; transform: translateY(-2px); }

        /* ترتیب تبدیل کرنے کے لیے */
        .menu-left { display: flex; align-items: center; gap: 20px; }
        .actions-right { display: flex; align-items: center; gap: 20px; }
    </style>
</head>
<body>

<header>
    <div class="menu-left">
        <div style="color:white; font-size: 24px; cursor: pointer;">☰</div>
        <div class="logo-box">
            <div class="cfaa-logo">
                <span style="font-weight:bold;">CFA</span>
                <span style="font-size: 10px;">AI</span>
            </div>
            <div class="glow-text">Code-Future Academy AI</div>
        </div>
    </div>

    <div class="actions-right">
        <a href="#" style="color:white; text-decoration:none;">Login</a>
        <a href="#" style="background:#6e8efb; padding:8px 20px; border-radius:20px; color:white; text-decoration:none;">Get Started</a>
    </div>
</header>

</body>
</html>
