<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    padding-top:80px;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    box-shadow:0 2px 20px rgba(0,0,0,0.08);
    z-index:1000;
}

.logo h2{
    font-size:28px;
    font-weight:700;
    color:#111;
}

.navbar{
    display:flex;
    gap:35px;
}

.navbar a{
    text-decoration:none;
    color:#333;
    font-size:16px;
    font-weight:600;
    transition:.3s;
}

.navbar a:hover{
    color:#0066ff;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.login-btn{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:#0066ff;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.menu-btn{
    display:none;
    background:none;
    border:none;
    font-size:32px;
    cursor:pointer;
}

@media(max-width:768px){

    .navbar{
        display:none;
        position:absolute;
        top:80px;
        left:0;
        width:100%;
        background:#fff;
        flex-direction:column;
        gap:0;
        box-shadow:0 10px 20px rgba(0,0,0,0.08);
    }

    .navbar a{
        padding:18px 25px;
        border-bottom:1px solid #eee;
    }

    .navbar.active{
        display:flex;
    }

    .menu-btn{
        display:block;
    }

    .logo h2{
        font-size:22px;
    }

    .login-btn{
        padding:8px 16px;
        font-size:14px;
    }
}
        .hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:120px 20px 80px;
    background:linear-gradient(
        135deg,
        #f8fbff,
        #eef4ff,
        #ffffff
    );
}

.hero-content{
    max-width:800px;
}

.hero-content h1{
    font-size:4rem;
    color:#111;
    margin-bottom:20px;
    line-height:1.1;
}

.hero-content p{
    font-size:1.2rem;
    color:#666;
    line-height:1.8;
    margin-bottom:35px;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.primary-btn{
    padding:14px 32px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.secondary-btn{
    padding:14px 32px;
    border:2px solid #0066ff;
    border-radius:50px;
    background:transparent;
    color:#0066ff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

@media(max-width:768px){

    .hero-content h1{
        font-size:2.5rem;
    }

    .hero-content p{
        font-size:1rem;
    }

}
    </style>
</head>

<body>
    <header>

    <div class="logo">
        <h2>My Website</h2>
    </div>

 <nav class="navbar" id="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
    </nav>
<div class="header-actions">
    <button class="login-btn">Login</button>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>
    </header>
    <section class="hero">

    <div class="hero-content">

        <h1>Build Something Amazing</h1>

        <p>
            Create modern, professional and responsive websites
            with a premium user experience.
        </p>

        <div class="hero-buttons">
            <button class="primary-btn">Get Started</button>
            <button class="secondary-btn">Learn More</button>
        </div>

    </div>

    </section>
    <script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
}
    </script>

</body>


</html>
