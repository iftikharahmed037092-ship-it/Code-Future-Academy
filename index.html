<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Code Future Academy</title>
    <style>
        /* CSS: ڈیزائن اور اینیمیشن */
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 50px; }
        h1 { color: #2c3e50; animation: fadeIn 2s; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        .btn:hover { background: #2980b9; transform: scale(1.1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <h1>Code Future Academy</h1>
    <p>آپ کا ڈیجیٹل مستقبل یہاں سے شروع ہوتا ہے۔</p>
    
    <br><br>
    <button class="btn" onclick="showMessage()">کورس دیکھیں</button>

    <script>
        // JavaScript: بٹن کا فنکشن
        function showMessage() {
            alert("کورسز کا صفحہ جلد آرہا ہے، تیار رہیں!");
        }
    </script>

</body>
</html>
