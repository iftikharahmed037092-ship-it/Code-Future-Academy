<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code-Future Academy AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e14; color: white; }
        
        /* ہیڈر کا ڈیزائن */
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: #0b0e14; border-bottom: 1px solid #222; }
        
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-icon { background: linear-gradient(135deg, #6e8efb, #a777e3); padding: 8px 15px; border-radius: 8px; font-weight: 800; }
        
        nav { display: flex; align-items: center; }
        nav a { color: #a0a0a0; text-decoration: none; margin: 0 15px; transition: 0.3s; }
        nav a:hover { color: #6e8efb; }

        .auth-btns { display: flex; gap: 15px; align-items: center; }
        .btn-login { color: white; text-decoration: none; }
        .btn-start { background: linear-gradient(90deg, #6e8efb, #a777e3); padding: 8px 20px; border-radius: 20px; color: white; text-decoration: none; }

        /* موبائل مینیو (تین لائنیں) */
        .menu-toggle { display: none; cursor: pointer; font-size: 24px; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            nav { display: none; position: absolute; top: 70px; right: 0; background: #161b22; width: 100%; flex-direction: column; padding: 20px; }
            nav.active { display: flex; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-box">
        <div class="logo-icon">CFAA</div>
        <span>Code-Future Academy AI</span>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <nav id="navMenu">
        <a href="#">ہوم</a>
        <a href="#">ٹیمپلیٹس</a>
        <a href="#">فیچرز</a>
    </nav>

    <div class="auth-btns">
        <a href="#" class="btn-login">Login</a>
        <a href="#" class="btn-start">Get Started</a>
    </div>
</header>

<script>
    function toggleMenu() {
        const nav = document.getElementById('navMenu');
        nav.classList.toggle('active');
    }
</script>

</body>
</html>
