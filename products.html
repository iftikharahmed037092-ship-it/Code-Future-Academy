<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products</title>

<style>
/*======================================
RESET
======================================*/

*{
margin:0;
padding:0;
box-sizing:border-box;
}


/*======================================
BODY
======================================*/

body{

background:#f5f7fb;

font-family:Arial,sans-serif;

color:#111;

}


/*======================================
BACK BUTTON
======================================*/

.back-btn{

position:fixed;

top:20px;

left:20px;

width:48px;

height:48px;

display:flex;

justify-content:center;

align-items:center;

background:#fff;

color:#111;

text-decoration:none;

font-size:24px;

border-radius:50%;

box-shadow:0 8px 20px rgba(0,0,0,.12);

transition:.3s;

z-index:999;

}

.back-btn:hover{

transform:translateY(-3px);

}


/*======================================
MAIN CONTAINER
======================================*/

.container{

max-width:1600px;

margin:auto;

padding:90px 25px 40px;

}


/*======================================
PAGE TITLE
======================================*/

.page-title{

font-size:40px;

font-weight:700;

text-align:center;

margin-bottom:35px;

color:#111;

}


/*======================================
SEARCH BOX
======================================*/

.search-box{

width:100%;

max-width:650px;

margin:auto;

margin-bottom:40px;

}

.search-box input{

width:100%;

padding:18px 25px;

border:1px solid #ddd;

border-radius:50px;

font-size:17px;

outline:none;

background:white;

transition:.3s;

}

.search-box input:focus{

border-color:#0066ff;

box-shadow:0 0 12px rgba(0,102,255,.18);

}


/*======================================
PRODUCT GRID
======================================*/

.products-grid{

display:grid;

/* Desktop پر خود بخود زیادہ Cards */

grid-template-columns:
repeat(auto-fill,minmax(260px,1fr));

gap:30px;

align-items:stretch;

}


/*======================================
PRODUCT CARD
======================================*/

.product-card{

background:white;

border-radius:22px;

overflow:hidden;

display:flex;

flex-direction:column;

height:100%;

box-shadow:

0 10px 30px rgba(0,0,0,.08);

transition:.35s;

}

.product-card:hover{

transform:translateY(-8px);

box-shadow:

0 18px 40px rgba(0,0,0,.14);

}
    /*======================================
PRODUCT IMAGE
======================================*/

.product-image{

width:100%;

height:240px;

object-fit:cover;

display:block;

}


/*======================================
PRODUCT CONTENT
======================================*/

.product-content{

display:flex;

flex-direction:column;

flex:1;

padding:22px;

}


/*======================================
TITLE
======================================*/

.product-title{

font-size:22px;

font-weight:700;

color:#111;

margin-bottom:12px;

min-height:56px;

line-height:1.3;

}


/*======================================
PRICE
======================================*/

.product-price{

font-size:24px;

font-weight:bold;

color:#0066ff;

margin-bottom:12px;

}


/*======================================
DESCRIPTION
======================================*/

.product-description{

font-size:15px;

line-height:1.7;

color:#666;

min-height:95px;

margin-bottom:18px;

overflow:hidden;

}


/*======================================
CATEGORY
======================================*/

.product-category{

font-size:15px;

color:#555;

margin-bottom:20px;

}


/*======================================
BUTTON AREA
======================================*/

.product-buttons{

display:flex;

align-items:center;

gap:12px;

margin-top:auto;

}


/*======================================
WISHLIST BUTTON
======================================*/

.wishlist-btn{

width:50px;

height:50px;

border:none;

border-radius:50%;

background:#ff3366;

color:white;

font-size:20px;

cursor:pointer;

transition:.3s;

flex-shrink:0;

}

.wishlist-btn:hover{

background:#ff1744;

transform:scale(1.08);

}


/*======================================
VIEW DETAILS
======================================*/

.view-btn{

flex:1;

text-align:center;

text-decoration:none;

background:#0066ff;

color:white;

padding:14px;

border-radius:50px;

font-weight:bold;

transition:.3s;

}

.view-btn:hover{

background:#0052cc;

}


/*======================================
BUY NOW
======================================*/

.buy-btn{

flex:1;

border:none;

background:#00b894;

color:white;

padding:14px;

border-radius:50px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.buy-btn:hover{

background:#009b78;

    }
    /*======================================
LARGE DESKTOP
======================================*/

@media (min-width:1600px){

.products-grid{

grid-template-columns:
repeat(5,1fr);

}

}


/*======================================
DESKTOP
======================================*/

@media (max-width:1400px){

.products-grid{

grid-template-columns:
repeat(4,1fr);

}

}


/*======================================
LAPTOP
======================================*/

@media (max-width:1100px){

.products-grid{

grid-template-columns:
repeat(3,1fr);

}

}


/*======================================
TABLET
======================================*/

@media (max-width:768px){

.container{

padding:85px 18px 30px;

}

.page-title{

font-size:30px;

margin-bottom:25px;

}

.search-box{

margin-bottom:30px;

}

.products-grid{

grid-template-columns:
repeat(2,1fr);

gap:20px;

}

.product-image{

height:200px;

}

.product-title{

font-size:18px;

min-height:48px;

}

.product-price{

font-size:20px;

}

.product-description{

min-height:80px;

font-size:14px;

}

.product-buttons{

gap:8px;

}

.view-btn,

.buy-btn{

padding:12px;

font-size:14px;

}

}


/*======================================
SMALL MOBILE
======================================*/

@media (max-width:480px){

.products-grid{

grid-template-columns:1fr;

}

.page-title{

font-size:26px;

}

.search-box input{

font-size:15px;

padding:15px 20px;

}

.product-image{

height:220px;

}

    }

</style>

</head>

<body>

<a href="dashboard.html" class="back-btn">
←
</a>

<div class="container">

<h1 class="page-title">
Our Products & Services
</h1>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Products...">

</div>

<div
class="products-grid"
id="productsGrid">

<!-- Products Firebase سے یہاں آئیں گے -->

</div>

</div>

<script type="module" src="products.js"></script>

</body>

</html>
