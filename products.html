<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    z-index:999;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:90px 20px 30px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
    color:#111;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.product-card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-image{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-content{
    padding:20px;
}

.product-title{
    font-size:20px;
    margin-bottom:10px;
}

.product-price{
    color:#0066ff;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.product-description{
    color:#666;
    line-height:1.6;
    margin-bottom:15px;
}

.view-btn{
    display:inline-block;
    text-decoration:none;
    background:#0066ff;
    color:white;
    padding:12px 20px;
    border-radius:50px;
    font-weight:600;
}

</style>

</head>

<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="container">

    <h1 class="page-title">
        Our Products & Services
    </h1>

    <div class="products-grid" id="productsGrid">

        <!-- Products Firebase سے خودکار طور پر یہاں آئیں گے -->

    </div>

</div>

<script type="module" src="products.js"></script>

</body>

</html>
