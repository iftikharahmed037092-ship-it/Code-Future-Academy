<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    background:#fff;

    border-radius:50%;

    color:#111;

    font-size:24px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.profile-container{
    max-width:700px;
    margin:100px auto;
    padding:20px;
}

.profile-box{
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.profile-title{
    text-align:center;
    margin-bottom:25px;
}

.profile-image{
    width:120px;
    height:120px;

    border-radius:50%;

    background:#e5e7eb;

    margin:0 auto 25px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.save-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:50px;

    background:#111;
    color:#fff;

    cursor:pointer;
}

</style>

</head>
<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="profile-container">

    <div class="profile-box">

        <h1 class="profile-title">
            My Profile
        </h1>

        <div class="profile-image"></div>

        <div class="input-group">
            <input type="text" placeholder="Full Name">
        </div>

        <div class="input-group">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="input-group">
            <input type="tel" placeholder="Phone Number">
        </div>

        <div class="input-group">
            <input type="password" placeholder="New Password">
        </div>

        <button class="save-btn">
            Save Changes
        </button>

    </div>

</div>

</body>
</html>
