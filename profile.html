<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link rel="stylesheet" href="profile.css">

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.profile-container{
    width:100%;
    padding:20px;
}

.profile-card{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    text-align:center;
}

.profile-image{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:20px;
    border:5px solid #0066ff;
}

#userName{
    color:#111;
    margin-bottom:10px;
}

#userEmail{
    color:#666;
    margin-bottom:25px;
}

.profile-info{
    display:grid;
    gap:15px;
    margin-bottom:25px;
}

.info-box{
    background:#f7f9ff;
    padding:15px;
    border-radius:15px;
}

.info-box span{
    display:block;
    font-size:14px;
    color:#666;
    margin-bottom:5px;
}

.info-box p{
    color:#111;
    font-weight:600;
}

.profile-actions{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.profile-actions button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

.profile-actions button:hover{
    opacity:.9;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}
    </style>

</head>

<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="profile-container">

    <div class="profile-card">

        <img
        src="https://via.placeholder.com/150"
        alt="Profile"
        id="profileImage"
        class="profile-image">

        <h1 id="userName">User Name</h1>

        <p id="userEmail">user@email.com</p>

        <div class="profile-info">

            <div class="info-box">
                <span>Phone</span>
                <p id="userPhone">Not Added</p>
            </div>

            <div class="info-box">
                <span>Country</span>
                <p id="userCountry">Not Added</p>
            </div>

            <div class="info-box">
                <span>Member Since</span>
                <p id="joinDate">2026</p>
            </div>

        </div>

        <div class="profile-actions">

            <a href="settings.html">
                <button>Edit Profile</button>
            </a>

            <a href="orders.html">
                <button>My Orders</button>
            </a>

            <a href="services.html">
                <button>My Services</button>
            </a>

        </div>

    </div>

</div>

<script type="module" src="profile.js"></script>

</body>

</html>
