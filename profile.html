<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - Code Future Academy</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="profile-container">
    
    <div class="profile-header">
        <div class="avatar-circle">👤</div>
        <div>
            <h1 class="profile-name">User Name</h1>
            <p class="profile-email">user@email.com</p>
            <span class="profile-badge">Verified Member</span>
        </div>
    </div>

    <div class="profile-grid">
        <div class="profile-card">
            <h2>Profile Information</h2>
            <div class="info-item">
                <span class="info-label">Full Name</span>
                <span class="info-value">User Name</span>
            </div>
            <div class="info-item">
                <span class="info-label">Email Address</span>
                <span class="info-value">user@email.com</span>
            </div>
            <div class="info-item">
                <span class="info-label">Phone Number</span>
                <span class="info-value">Not Added</span>
            </div>
            <div class="info-item">
                <span class="info-label">Country</span>
                <span class="info-value">Pakistan</span>
            </div>
            <div class="info-item">
                <span class="info-label">Member Since</span>
                <span class="info-value">July 2026</span>
            </div>
        </div>

        <div class="profile-card">
            <h2>Quick Actions</h2>
            <div class="profile-actions">
                <a href="edit-profile.html" class="btn btn-primary">✏️ Edit Profile</a>
                <a href="orders.html" class="btn btn-secondary">📦 My Orders</a>
                <a href="services.html" class="btn btn-secondary">⚡ My Services</a>
                <a href="wishlist.html" class="btn btn-secondary">❤️ Wishlist</a>
                <a href="settings.html" class="btn btn-secondary">🔧 Settings</a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
