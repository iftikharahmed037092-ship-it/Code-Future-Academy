<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border-radius:50%;
text-decoration:none;
color:#111;
font-size:24px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
max-width:900px;
margin:auto;
padding:100px 20px 40px;
}

.title{
text-align:center;
margin-bottom:30px;
}

.chat-box{
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
height:400px;
overflow-y:auto;
margin-bottom:20px;
}

.message{
background:#f0f4ff;
padding:12px;
border-radius:12px;
margin-bottom:10px;
}

.input-area{
display:flex;
gap:10px;
}

.input-area input{
flex:1;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
}

.input-area button{
padding:14px 25px;
border:none;
border-radius:12px;
background:#0066ff;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="container">

<div class="title">
<h1>Messages</h1>
</div>

<div class="chat-box" id="chatBox">

<div class="message">
Welcome to Support Center
</div>

</div>

<div class="input-area">

<input
type="text"
id="messageInput"
placeholder="Type your message...">

<button id="sendBtn">
Send
</button>

</div>

</div>

<script src="messages.js"></script>

</body>
</html>
