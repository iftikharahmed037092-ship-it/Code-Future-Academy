<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews & Ratings</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.container{
    max-width:800px;
    margin:auto;
    padding:90px 20px;
}

.review-box{
    background:#fff;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:12px;
}

textarea{
    height:140px;
    resize:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.review-card{
    margin-top:20px;
    background:#f8f9ff;
    padding:20px;
    border-radius:15px;
}

.review-stars{
    color:gold;
    margin-bottom:10px;
}

</style>

</head>

<body>

<a href="javascript:history.back()" class="back-btn">←</a>

<div class="container">

<div class="review-box">

<h1>Reviews & Ratings</h1>

<form id="reviewForm">

<input
type="text"
id="reviewName"
placeholder="Your Name"
required>

<select id="reviewRating">

<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>

</select>

<textarea
id="reviewText"
placeholder="Write your review"
required>
</textarea>

<button type="submit">
Submit Review
</button>

</form>

<div class="review-card">

<div class="review-stars">
⭐⭐⭐⭐⭐
</div>

<h3>Ahmed</h3>

<p>
Excellent service and professional work.
</p>

</div>

</div>

</div>

<script type="module" src="reviews.js"></script>

</body>

  </html>
