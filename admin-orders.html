<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Orders</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
    max-width:1000px;
    margin:auto;
    padding:90px 20px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.order-card{
    background:#fff;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.order-card h3{
    margin-bottom:10px;
}

.order-card p{
    margin-bottom:8px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.actions button{
    padding:10px 15px;
    border:none;
    border-radius:50px;
    cursor:pointer;
}

.approve-btn{
    background:#28a745;
    color:white;
}

.complete-btn{
    background:#0066ff;
    color:white;
}

.cancel-btn{
    background:#dc3545;
    color:white;
}

</style>

</head>

<body>

<a href="javascript:history.back()" class="back-btn">←</a>

<div class="container">

<h1 class="page-title">
Admin Orders
</h1>

<div id="ordersList">

<div class="order-card">

<h3>Order #1001</h3>

<p>Customer: Ahmed</p>

<p>Product: Website Template</p>

<p>Price: Rs 5,000</p>

<p>Status: Pending</p>

<div class="actions">

<button class="approve-btn">
Approve
</button>

<button class="complete-btn">
Complete
</button>

<button class="cancel-btn">
Cancel
</button>

</div>

</div>

</div>

</div>

<script type="module" src="admin-orders.js"></script>

</body>

</html>
