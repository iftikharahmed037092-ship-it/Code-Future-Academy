<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:90px 20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.notification-card{
    background:#fff;
    padding:20px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.notification-title{
    font-weight:bold;
    margin-bottom:8px;
}

.notification-time{
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<a href="javascript:history.back()" class="back-btn">←</a>

<div class="container">

<h1>Notifications</h1>

<div id="notificationsList">

<div class="notification-card">
<div class="notification-title">
Order Approved
</div>
<p>Your order #1001 has been approved.</p>
<div class="notification-time">
2 minutes ago
</div>
</div>

<div class="notification-card">
<div class="notification-title">
New Product Added
</div>
<p>A new website template is now available.</p>
<div class="notification-time">
1 hour ago
</div>
</div>

</div>

</div>

<script type="module" src="notifications.js"></script>

</body>

</html>
