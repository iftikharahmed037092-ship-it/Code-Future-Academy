<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
    max-width:1000px;
    margin:auto;
    padding:90px 20px;
}

.page-title{
    text-align:center;
    margin-bottom:30px;
}

.order-card{
    background:#fff;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.order-id{
    font-weight:bold;
    margin-bottom:10px;
}

.order-product{
    margin-bottom:10px;
}

.order-price{
    color:#0066ff;
    font-weight:bold;
    margin-bottom:10px;
}

.order-status{
    display:inline-block;
    padding:8px 15px;
    border-radius:50px;
    background:#fff4d6;
    color:#b8860b;
    font-weight:bold;
}
    .buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.buttons button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:white;
}

.accept-btn{
background:#00b894;
}

.reject-btn{
background:#ff3b30;
}

.complete-btn{
background:#0066ff;
    }

</style>

</head>

<body>

<a href="seller-dashboard.html" class="back-btn">←</a>

<div class="container">

<h1 class="page-title">
My Orders
</h1>

<div id="ordersContainer">

<div class="order-card">

<div class="order-id">
Order #1001
</div>

<div class="order-product">
Website Template
</div>

<div class="order-price">
Rs 5,000
</div>

<div class="order-status">
Pending
</div>

</div>

</div>

</div>

<script type="module" src="orders.js"></script>

</body>

</html>
