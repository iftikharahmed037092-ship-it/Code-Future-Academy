<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border-radius:50%;
text-decoration:none;
color:#111;
font-size:24px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
max-width:1200px;
margin:auto;
padding:100px 20px 40px;
}

.title{
text-align:center;
margin-bottom:30px;
}

.title h1{
font-size:36px;
color:#111;
}

.wishlist-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.wishlist-card{
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.wishlist-card h3{
margin-bottom:10px;
}

.wishlist-card p{
color:#666;
margin-bottom:15px;
}

.price{
font-size:20px;
font-weight:bold;
color:#0066ff;
margin-bottom:15px;
}

.btn-group{
display:flex;
gap:10px;
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
color:#fff;
}

.cart-btn{
background:#0066ff;
}

.remove-btn{
background:#dc3545;
}

.empty-box{
background:#fff;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

</style>
</head>

<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="container">

<div class="title">
<h1>My Wishlist</h1>
</div>

<div class="wishlist-grid">

<div class="wishlist-card">

<h3>Website Template</h3>

<p>Modern responsive website template.</p>

<div class="price">
Rs 5,000
</div>

<div class="btn-group">

<button class="btn cart-btn">
Add To Cart
</button>

<button class="btn remove-btn">
Remove
</button>

</div>

</div>

</div>

</div>

</body>
</html>
