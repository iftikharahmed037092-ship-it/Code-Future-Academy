<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
width:45px;
height:45px;
border-radius:50%;
background:#fff;
color:#111;
text-decoration:none;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
max-width:1100px;
margin:auto;
padding:90px 20px;
}

.title{
text-align:center;
margin-bottom:30px;
}

.wishlist-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
}

.card p{
margin-bottom:15px;
color:#666;
}

.price{
font-size:20px;
font-weight:bold;
color:#0066ff;
margin-bottom:15px;
}

.btn-group{
display:flex;
gap:10px;
}

.cart-btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:#0066ff;
color:#fff;
cursor:pointer;
}

.remove-btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:#dc3545;
color:#fff;
cursor:pointer;
}

</style>

</head>

<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="container">

<h1 class="title">
My Wishlist
</h1>

<div class="wishlist-grid">

<div class="card">

<h3>Premium Website Template</h3>

<p>Modern responsive website template.</p>

<div class="price">
Rs 5,000
</div>

<div class="btn-group">

<button class="cart-btn">
Add To Cart
</button>

<button class="remove-btn">
Remove
</button>

</div>

</div>

</div>

</div>

<script type="module" src="wishlist.js"></script>

</body>

</html>
