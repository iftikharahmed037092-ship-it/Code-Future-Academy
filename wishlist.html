<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
}

#wishlistItems{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:15px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
}

.card h2{
font-size:20px;
margin-bottom:10px;
}

.price{
color:#0066ff;
font-weight:bold;
margin-bottom:10px;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

button{
flex:1;
padding:12px;
border:none;
border-radius:40px;
cursor:pointer;
font-weight:bold;
}

.cart-btn{
background:#0066ff;
color:white;
}

.remove-btn{
background:red;
color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>My Wishlist</h1>

<div id="wishlistItems"></div>

</div>

<script type="module" src="wishlist.js"></script>

</body>
</html>
