<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border-radius:50%;
text-decoration:none;
color:#111;
font-size:24px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
max-width:1200px;
margin:auto;
padding:100px 20px 40px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.products-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.product-card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.product-card img{
width:100%;
height:220px;
object-fit:cover;
}

.content{
padding:20px;
}

.content h2{
margin-bottom:10px;
}

.price{
font-size:22px;
color:#0066ff;
font-weight:bold;
margin-bottom:10px;
}

.desc{
color:#666;
margin-bottom:20px;
line-height:1.6;
}

.buttons{
display:flex;
gap:10px;
}

.edit-btn,
.delete-btn{
flex:1;
padding:12px;
border:none;
border-radius:50px;
cursor:pointer;
font-weight:bold;
}

.edit-btn{
background:#0066ff;
color:#fff;
}

.delete-btn{
background:#ff3b30;
color:#fff;
}

</style>

</head>

<body>

<a href="seller-dashboard.html" class="back-btn">←</a>

<div class="container">

<h1>Manage Products</h1>

<div class="products-grid" id="productsGrid">

</div>

</div>

<script type="module" src="manage-products.js"></script>

</body>
</html>
