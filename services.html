<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Services</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    background:#fff;

    border-radius:50%;

    color:#111;

    font-size:24px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.services-container{
    max-width:1200px;
    margin:100px auto;
    padding:20px;
}

.services-title{
    margin-bottom:25px;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.service-card{
    background:#fff;

    padding:25px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.service-card h3{
    margin-bottom:12px;
}

.service-card p{
    color:#666;
    line-height:1.7;
    margin-bottom:15px;
}

.service-btn{
    display:inline-block;

    padding:12px 20px;

    border-radius:50px;

    background:#111;

    color:#fff;

    text-decoration:none;
}

</style>

</head>
<body>

    <a href="dashboard.html">←</a>

<a href="dashboard.html" class="back-btn">←</a>

<div class="services-container">

    <h1 class="services-title">
        My Services
    </h1>

    <div class="services-grid">

        <div class="service-card">
            <h3>Premium Service</h3>
            <p>Service description goes here.</p>
            <a href="#" class="service-btn">Open Service</a>
        </div>

        <div class="service-card">
            <h3>Business Service</h3>
            <p>Service description goes here.</p>
            <a href="#" class="service-btn">Open Service</a>
        </div>

        <div class="service-card">
            <h3>VIP Service</h3>
            <p>Service description goes here.</p>
            <a href="#" class="service-btn">Open Service</a>
        </div>

    </div>

</div>

</body>
</html>
