<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container{
    max-width:1000px;
    margin:auto;
    padding:90px 20px;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

.search-box input{
    flex:1;
    padding:15px;
    border:1px solid #ddd;
    border-radius:50px;
    outline:none;
}

.search-box button{
    padding:15px 25px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:#fff;
    cursor:pointer;
}

.result-card{
    background:#fff;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.result-card h3{
    margin-bottom:10px;
}

.result-card p{
    color:#666;
}

</style>

</head>

<body>

<a href="javascript:history.back()" class="back-btn">←</a>

<div class="container">

<h1 class="page-title">
Search Products & Services
</h1>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search here...">

<button id="searchBtn">
Search
</button>

</div>

<div id="searchResults">

<div class="result-card">

<h3>Website Template</h3>

<p>
Professional responsive website template.
</p>

</div>

</div>

</div>

<script type="module" src="search.js"></script>

</body>

</html>
