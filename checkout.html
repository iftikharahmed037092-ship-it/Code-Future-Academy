<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h1{
text-align:center;
margin-bottom:30px;
}

.product-box{
display:flex;
gap:20px;
align-items:center;
margin-bottom:30px;
padding-bottom:20px;
border-bottom:1px solid #ddd;
}

.product-box img{
width:120px;
height:120px;
object-fit:cover;
border-radius:15px;
}

.product-info h2{
margin-bottom:10px;
}

.product-info p{
color:#0066ff;
font-size:22px;
font-weight:bold;
}

form{
display:grid;
gap:18px;
}

input,
textarea,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

textarea{
resize:none;
height:120px;
}

button{
padding:16px;
background:#0066ff;
color:#fff;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#0052cc;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Checkout</h1>

<div class="product-box">

<img id="productImage" src="">

<div class="product-info">

<h2 id="productTitle">
Loading...
</h2>

<p id="productPrice">
Rs 0
</p>

</div>

</div>

<form id="checkoutForm">

<input
type="text"
id="customerName"
placeholder="Full Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<textarea
id="address"
placeholder="Complete Address"
required>
</textarea>

<input
type="text"
id="city"
placeholder="City"
required>

<select id="payment">

<option>
Cash On Delivery
</option>

<option>
JazzCash
</option>

<option>
EasyPaisa
</option>

</select>

<button type="submit">

Confirm Order

</button>

</form>

</div>

</div>

<script type="module" src="checkout.js"></script>

</body>

</html>
