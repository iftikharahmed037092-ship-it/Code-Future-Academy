<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | CFA AI</title>


<!-- CSS -->
<link rel="stylesheet" href="admin-products.css">


<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>
<body>


<div class="admin-container">



<!-- HEADER -->

<header class="admin-header">


<a href="products.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</a>



<div>

<h1>
Add New Product
</h1>


<p>
Create and manage CFA AI products
</p>


</div>


</header>







<form id="productForm">



<!-- IMAGE BOX -->


<div class="image-card">


<h2>
Product Image
</h2>



<img 
id="imagePreview"
src="images/no-image.png"
alt="Product Preview">



<input
type="url"
id="productImage"
placeholder="Paste Image URL">



</div>



<!-- DETAILS BOX -->


<div class="form-card">


<h2>
Product Details
</h2>





<label>
Product Name
</label>


<input
type="text"
id="productName"
placeholder="Enter Product Name"
required>








<label>
Price
</label>


<input
type="number"
id="productPrice"
placeholder="Enter Price"
required>








<label>
Old Price
</label>


<input
type="number"
id="oldPrice"
placeholder="Enter Old Price">







<label>
Discount
</label>


<input
type="text"
id="discount"
placeholder="Example: 50% OFF">







<!-- CATEGORY SELECT -->


<label>
Category
</label>


<select id="productCategory" required>


<option value="">
Select Category
</option>


<option value="Website Templates">
Website Templates
</option>


<option value="AI Tools">
AI Tools
</option>


<option value="Mobile Apps">
Mobile Apps
</option>


<option value="Logos">
Logo Design
</option>


<option value="Graphics">
Graphics Design
</option>


<option value="Web Development">
Web Development
</option>


<option value="Courses">
Courses
</option>


<option value="Digital Products">
Digital Products
</option>


</select>







<label>
Badge
</label>


<select id="productBadge">


<option value="None">
None
</option>


<option value="New">
New
</option>


<option value="Sale">
Sale
</option>


<option value="Hot">
Hot
</option>


<option value="Featured">
Featured
</option>


<option value="Best Seller">
Best Seller
</option>


</select>







<label>
Stock Status
</label>


<select id="productStock">


<option value="Available">
Available
</option>


<option value="Out Of Stock">
Out Of Stock
</option>


</select>







<label>
Rating
</label>


<input
type="number"
id="productRating"
value="5"
min="1"
max="5">







<label>
Description
</label>


<textarea
id="productDescription"
placeholder="Write Product Description">
</textarea>








<button type="submit">

<i class="fa-solid fa-plus"></i>

Add Product

</button>





</div>



</form>




</div>



<script type="module" src="admin-products.js"></script>


</body>

</html>
