<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Center</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Arial,sans-serif;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    background:#fff;
    color:#111;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.container{
    max-width:800px;
    margin:auto;
    padding:90px 20px;
}

.support-box{
    background:#fff;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:12px;
}

textarea{
    height:150px;
    resize:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>

<body>

<a href="javascript:history.back()" class="back-btn">←</a>

<div class="container">

<div class="support-box">

<h1>Support Center</h1>

<form id="supportForm">

<input
type="text"
id="name"
placeholder="Your Name"
required>

<input
type="email"
id="email"
placeholder="Your Email"
required>

<select id="issueType">

<option>General Question</option>

<option>Order Issue</option>

<option>Payment Issue</option>

<option>Technical Problem</option>

<option>Other</option>

</select>

<textarea
id="message"
placeholder="Describe your issue">
</textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

</div>

<script type="module" src="support.js"></script>

</body>

</html>
