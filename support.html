<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Center</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    background:#fff;
    border-radius:50%;
    color:#111;
    font-size:24px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.support-container{
    max-width:800px;
    margin:100px auto;
    padding:20px;
}

.support-box{
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.support-box h1{
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.submit-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:50px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

</style>

</head>
<body>

<a href="dashboard.html" class="back-btn">←</a>

<div class="support-container">

    <div class="support-box">

        <h1>Support Center</h1>

        <div class="input-group">
            <input type="text" placeholder="Subject">
        </div>

        <div class="input-group">
            <input type="email" placeholder="Email Address">
        </div>

        <div class="input-group">
            <textarea placeholder="Describe your issue"></textarea>
        </div>

        <button class="submit-btn">
            Submit Ticket
        </button>

    </div>

</div>

</body>
</html>
