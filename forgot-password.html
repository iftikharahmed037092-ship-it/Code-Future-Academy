<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="forgot-password.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:linear-gradient(
        135deg,
        #eef4ff,
        #ffffff,
        #f4f7ff
    );
}

.container{
    width:100%;
    padding:20px;
}

.forgot-box{
    width:100%;
    max-width:500px;

    background:#fff;

    padding:40px;

    border-radius:25px;

    box-shadow:0 20px 40px rgba(0,0,0,.1);
}

.forgot-box h1{
    text-align:center;
    margin-bottom:15px;
}

.forgot-box p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    line-height:1.6;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:15px;
    font-size:16px;
}

button{
    padding:15px;
    border:none;
    border-radius:50px;
    background:#0066ff;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.login-text{
    text-align:center;
    margin-top:20px;
}

.login-text a{
    text-decoration:none;
    color:#0066ff;
    font-weight:600;
}

.back-btn{
    position:fixed;
    top:80px;
    left:20px;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    background:#fff;

    border-radius:50%;

    color:#111;

    font-size:24px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    z-index:9999;
}

</style>

</head>
<body>

<a href="login.html" class="back-btn">←</a>

<div class="container">

    <div class="forgot-box">

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll send you a password reset link.
        </p>

        <form>

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="login-text">

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
